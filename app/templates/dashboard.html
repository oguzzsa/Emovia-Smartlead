<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMOVIA Dashboard</title>
    <style>
        body {
            margin: 0;
            background: #f5f2ff;
            font-family: Arial, sans-serif;
            padding: 28px;
            color: #1d2433;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 12px 28px rgba(98, 75, 190, 0.08);
            border-radius: 14px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #e7e0ff;
            padding: 12px 14px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #efeaff;
        }
        .empty {
            background: white;
            padding: 24px;
            border-radius: 14px;
            border: 1px solid #e7e0ff;
            text-align: center;
            color: #596178;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EMOVIA Lead Merkezi</h1>

        {% if leads %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>İsim</th>
                    <th>Telefon</th>
                    <th>Mesaj</th>
                    <th>Kayıt Tarihi</th>
                </tr>
            </thead>
            <tbody>
                {% for lead in leads %}
                <tr>
                    <td>{{ lead.id }}</td>
                    <td>{{ lead.isim }}</td>
                    <td>{{ lead.telefon }}</td>
                    <td>{{ lead.mesaj or '-' }}</td>
                    <td>{{ lead.tarih }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">Henüz kayıt alınmadı.</div>
        {% endif %}
    </div>
</body>
</html>
